<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VirtualLab</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <nav class="navbar" id="main-nav"></nav>

  <div class="auth-wrap">
    <div class="auth-card">

      <div class="logo-mark">🧪</div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your VirtualLab account</p>

      <div id="login-form-wrap">

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input id="email" type="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input id="password" type="password" class="form-input" placeholder="Your password" autocomplete="current-password" required>
              <button type="button" class="toggle-pw" onclick="togglePassword('password')">Show</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg mt-2">Sign In</button>
        </form>

        <div class="auth-divider">or</div>

        <p class="text-c text-sm">
          Don't have an account? <a href="signup.html">Create one free →</a>
        </p>

        <div class="alert alert-info mt-2" style="margin-top:1rem">
          <span>ℹ</span>
          <span>
            <strong>Demo:</strong> Sign up first, then log in with your credentials.
            All data is stored locally in your browser.
          </span>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
