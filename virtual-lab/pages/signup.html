<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — VirtualLab</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <nav class="navbar" id="main-nav"></nav>

  <div class="auth-wrap">
    <div class="auth-card">

      <div class="logo-mark">🔬</div>
      <h1>Create your account</h1>
      <p class="sub">Free forever. No credit card needed.</p>

      <div id="signup-form-wrap">
        <form id="signup-form" novalidate>

          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input id="name" type="text" class="form-input" placeholder="Your full name" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input id="email" type="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input id="password" type="password" class="form-input" placeholder="At least 6 characters" autocomplete="new-password" required>
              <button type="button" class="toggle-pw" onclick="togglePassword('password')">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm">Confirm Password</label>
            <div class="password-wrap">
              <input id="confirm" type="password" class="form-input" placeholder="Repeat password" autocomplete="new-password" required>
              <button type="button" class="toggle-pw" onclick="togglePassword('confirm')">Show</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg mt-2">Create Account</button>
        </form>

        <div class="auth-divider">or</div>

        <p class="text-c text-sm">
          Already have an account? <a href="login.html">Sign in →</a>
        </p>

        <p class="text-c text-sm text-sub mt-2" style="font-size:.78rem">
          Your data is stored locally in your browser. No information is sent to any server.
        </p>
      </div>

    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
